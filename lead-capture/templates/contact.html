<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Get in Touch — Lead Capture</title>
  <meta name="description" content="Send a message and it's saved instantly to a live database. A minimal, working contact form built with FastAPI and MongoDB.">

  <!-- Open Graph / social-share preview (WhatsApp, Facebook, LinkedIn, etc.) -->
  <meta property="og:title" content="Get in Touch — Lead Capture">
  <meta property="og:description" content="Send a message and it's saved instantly to a live database.">
  <meta property="og:type" content="website">

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Get in Touch — Lead Capture">
  <meta name="twitter:description" content="Send a message and it's saved instantly to a live database.">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #94a3b8; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    #status { margin-top: 14px; font-size: 14px; min-height: 20px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Get in Touch</h1>
    <p class="sub">Send a message — it's saved straight to the database.</p>
    <form id="contact-form">
      <input type="text" id="name" placeholder="Your name" required>
      <input type="email" id="email" placeholder="Your email" required>
      <textarea id="message" rows="4" maxlength="1000" placeholder="Your message (max 1000 characters)" required></textarea>
      <button type="submit">Send</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    document.getElementById("contact-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const statusEl = document.getElementById("status");
      const submitBtn = e.target.querySelector("button[type=submit]");

      // Prevent double/rapid submits from creating duplicate entries —
      // disable the button the instant Send is clicked, and only
      // re-enable it once this request has actually finished.
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      statusEl.textContent = "";
      statusEl.className = "";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value,
      };

      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.success) {
          statusEl.textContent = "✓ Thanks! Your message was received.";
          statusEl.className = "ok";
          document.getElementById("contact-form").reset();
        } else {
          statusEl.textContent = "Error: " + data.error;
          statusEl.className = "err";
        }
      } catch (err) {
        statusEl.textContent = "Something went wrong. Please try again.";
        statusEl.className = "err";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send";
      }
    });
  </script>
</body>
</html>
