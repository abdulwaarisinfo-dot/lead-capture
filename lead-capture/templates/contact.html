<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
    button { padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  <form id="contact-form">
    <input type="text" name="name" placeholder="Your name" maxlength="200" required>
    <input type="email" name="email" placeholder="Your email" required>
    <textarea name="message" placeholder="Your message" maxlength="1000" rows="5" required></textarea>
    <button type="submit">Send</button>
  </form>
  <p id="status"></p>

  <script>
    document.getElementById("contact-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = {
        name: form.name.value,
        email: form.email.value,
        message: form.message.value,
      };
      const res = await fetch("/api/contact", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      document.getElementById("status").textContent = data.success
        ? "Thanks — we got your message!"
        : "Error: " + data.error;
      if (data.success) form.reset();
    });
  </script>
</body>
</html>
